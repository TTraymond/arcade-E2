<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Arcade E2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Chakra+Petch:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Une borne d'arcade sombre (choix assumé d'un seul thème) : 3 « cabinets » de couleur, HUD en police pixel, textes à lire en police très lisible. */
:root{
  --bg:#0d0b1f; --panel:#17143a; --panel-2:#221d52; --ink:#f2efff; --ink-2:#b9b2e8; --ink-3:#8079b8; --line:#3a3380;
  --pink:#ff4fa3; --cyan:#3fe0e8; --amber:#ffb627; --good:#4ade80; --bad:#ff5d5d; --game:var(--pink);
  --f-pixel:"Press Start 2P","Courier New",monospace;
  --f-ui:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-read:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;overflow-x:hidden;
  background-image:radial-gradient(ellipse at 50% -20%,rgba(255,79,163,.18),transparent 60%),radial-gradient(ellipse at 100% 110%,rgba(63,224,232,.12),transparent 55%)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:14px 28px;min-height:100%;display:flex;flex-direction:column}
.pix{font-family:var(--f-pixel);letter-spacing:.02em}
.muted{color:var(--ink-2)}
.btn{border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--ink-2)}
.btn.go{background:var(--game);border-color:var(--game);color:#160a1f}
.btn.sm{padding:6px 10px;font-size:.88rem;border-radius:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Accueil */
.marquee{display:grid;gap:6px;text-align:center;padding-block:10px 18px}
.marquee h1{font-family:var(--f-pixel);font-size:clamp(1.5rem,6vw,2.6rem);margin:0;line-height:1.2;color:var(--ink);text-shadow:3px 3px 0 var(--pink),-2px -2px 0 rgba(63,224,232,.6)}
.marquee p{margin:0;color:var(--ink-2)}
.player{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px}
.player label{font-size:.8rem;color:var(--ink-2);text-transform:uppercase;letter-spacing:.08em}
.player input{width:100%;margin-top:4px;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--f-pixel);font-size:.8rem;text-transform:uppercase}
.rank{display:grid;gap:6px}
.rank b{font-family:var(--f-pixel);font-size:.78rem;color:var(--amber)}
.xpbar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--amber));width:0}
.cabinets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}
.cab{--game:var(--pink);border:2px solid var(--game);background:linear-gradient(180deg,color-mix(in srgb,var(--game) 16%,var(--panel)),var(--panel) 60%);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start;text-align:left;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 10px 30px -12px var(--game)}
.cab h2{font-family:var(--f-pixel);font-size:.95rem;line-height:1.5;margin:0;color:var(--game)}
.cab p{margin:0;font-size:.93rem;color:var(--ink-2)}
.cab .best{display:flex;justify-content:space-between;font-size:.85rem;border-top:1px dashed var(--line);padding-top:8px}
.cab .best b{font-family:var(--f-pixel);font-size:.75rem}
.cab .btn.go{width:100%;font-family:var(--f-pixel);font-size:.75rem;padding:12px}
.cab.c-note{--game:var(--cyan)} .cab.c-rush{--game:var(--amber)}
.home-foot{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}

/* Jeu */
.game{flex:1;display:flex;flex-direction:column;gap:10px;min-height:0}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-pixel);font-size:.7rem}
.hud .score{font-size:1rem;color:var(--game)}
.hud .lives{letter-spacing:.15em;color:var(--bad)}
.hud .combo{color:var(--amber)}
.field{position:relative;flex:1;min-height:250px;border:2px solid var(--game);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.05)),repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.025) 3px 4px),var(--panel)}
.field .ground{position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--game) 0 12px,transparent 12px 20px);opacity:.8}
.field .tag{position:absolute;bottom:12px;right:10px;font-family:var(--f-pixel);font-size:.55rem;color:var(--ink-3);text-transform:uppercase}
.card{position:absolute;left:50%;top:0;width:min(92%,560px);transform:translate(-50%,0);background:var(--bg);border:2px solid var(--game);border-radius:12px;padding:12px 14px;font-family:var(--f-read);font-size:1.02rem;line-height:1.4;box-shadow:0 0 18px -4px var(--game);will-change:transform}
.card .kind{display:block;font-family:var(--f-pixel);font-size:.5rem;color:var(--game);margin-bottom:6px;text-transform:uppercase}
.card.calc{font-family:var(--f-ui);font-size:1.15rem;font-weight:600;text-align:center}
.card.hit{border-color:var(--good);box-shadow:0 0 30px var(--good)}
.card.miss{border-color:var(--bad);box-shadow:0 0 30px var(--bad)}
.float{position:absolute;font-family:var(--f-pixel);font-size:.8rem;color:var(--good);pointer-events:none;animation:up .8s ease-out forwards}
@keyframes up{to{transform:translateY(-50px);opacity:0}}
.flash-bad{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.opts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.opt{position:relative;border:2px solid var(--line);background:var(--panel-2);border-radius:12px;padding:12px 10px;font-weight:700;font-size:.98rem;line-height:1.25;min-height:58px;text-align:center}
.opt:active{transform:translateY(2px)}
.opt .k{position:absolute;top:4px;left:6px;font-family:var(--f-pixel);font-size:.45rem;color:var(--ink-3)}
.opt.long{font-family:var(--f-read);font-weight:400;font-size:.86rem;text-align:left}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 25%,var(--panel-2))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 25%,var(--panel-2))}
.door{border-color:var(--amber);font-family:var(--f-pixel);font-size:.78rem;padding-top:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--amber) 18%,var(--panel-2)),var(--panel-2))}
.runner{position:absolute;bottom:10px;font-size:1.8rem;transition:left .15s;transform:translateX(-50%);line-height:1}
.levelup{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-pixel);font-size:1.1rem;color:var(--amber);text-shadow:3px 3px 0 #000;pointer-events:none;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:0}}
.order-round{position:absolute;inset:0;background:rgba(13,11,31,.94);display:grid;align-content:center;gap:10px;padding:14px;z-index:3}
.order-round h3{font-family:var(--f-pixel);font-size:.75rem;color:var(--cyan);margin:0;text-align:center;line-height:1.6}
.order-round .blocks{display:grid;gap:6px}
.order-round .blk{border:2px solid var(--line);background:var(--panel-2);border-radius:10px;padding:8px 10px;font-weight:700;text-align:left}
.order-round .blk.done{border-color:var(--good);opacity:.45}
.order-round .blk.err{border-color:var(--bad)}

/* Fin */
.over{display:grid;gap:14px;max-width:640px;margin:0 auto;width:100%}
.over .big{text-align:center;display:grid;gap:6px;padding:16px;border:2px solid var(--game);border-radius:16px;background:var(--panel)}
.over .big .pix{font-size:clamp(1.4rem,7vw,2.2rem);color:var(--game)}
.record{font-family:var(--f-pixel);font-size:.8rem;color:var(--amber);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.traps{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.traps h3{margin:0;font-family:var(--f-pixel);font-size:.7rem;color:var(--bad);line-height:1.6}
.trap{border-top:1px dashed var(--line);padding-top:8px;font-family:var(--f-read);font-size:.95rem}
.trap b{color:var(--good)}
.trap small{display:block;color:var(--ink-2)}

/* Classement */
.board{display:grid;gap:12px;max-width:680px;margin:0 auto;width:100%}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.9rem}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table.hs{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.hs td,table.hs th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
table.hs th{font-size:.75rem;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
table.hs td:first-child{font-family:var(--f-pixel);font-size:.7rem;width:3em;color:var(--amber)}
table.hs td.sc{font-family:var(--f-pixel);font-size:.72rem;text-align:right}
table.hs tr.me td{color:var(--cyan)}
.note{font-size:.88rem;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.x{border:0;background:transparent;color:var(--ink-3);padding:2px 6px}

.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-weight:700;z-index:20}

@media (max-width:760px){
  .cabinets{grid-template-columns:minmax(0,1fr)}
  .player{grid-template-columns:minmax(0,1fr)}
  .opts.many{--n:2!important}
}
@media (max-height:520px) and (orientation:landscape){
  .app{padding-block:8px}
  .game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);grid-template-rows:auto 1fr;gap:8px}
  .hud{grid-column:1/-1}
  .field{min-height:0}
  .opts{--n:1!important;align-content:center;overflow:auto}
  .opt{min-height:44px;padding:8px}
  .marquee{padding-block:4px 10px}
}
@media (prefers-reduced-motion: reduce){.float,.levelup,.record{animation:none}.runner{transition:none}}
</style>

<div class="app" id="app">
  <!-- ACCUEIL -->
  <section id="home">
    <div class="marquee"><h1>ARCADE E2</h1><p>Bac Pro MCV · joue, progresse, bats le record de la classe</p></div>
    <div class="player">
      <div><label for="pseudo">Ton pseudo de joueur</label><input id="pseudo" maxlength="12" autocomplete="off" placeholder="EX : KAMI62"></div>
      <div class="rank"><span class="muted" style="font-size:.8rem;text-transform:uppercase;letter-spacing:.08em">Ton grade</span><b id="rank-name">STAGIAIRE</b><div class="xpbar"><i id="xp-fill"></i></div><span class="muted" id="xp-txt" style="font-size:.82rem"></span></div>
    </div>
    <div class="cabinets" id="cabinets"></div>
    <div class="home-foot">
      <button class="btn" data-nav="board">🏆 Classement</button>
      <button class="btn" id="snd-btn">🔊 Son activé</button>
    </div>
  </section>

  <!-- JEU -->
  <section id="play" class="game" hidden>
    <div class="hud"><span class="score" id="h-score">0</span><span class="combo" id="h-combo">x1</span><span>NIV <span id="h-level">1</span></span><span class="lives" id="h-lives">♥♥♥</span><button class="btn sm" id="quit">✕ Quitter</button></div>
    <div class="field" id="field"><span class="tag" id="field-tag"></span><div class="ground"></div></div>
    <div class="opts" id="opts"></div>
  </section>

  <!-- FIN -->
  <section id="over" hidden>
    <div class="over" id="over-box"></div>
  </section>

  <!-- CLASSEMENT -->
  <section id="board" hidden>
    <div class="board">
      <div class="row" style="justify-content:space-between"><h2 class="pix" style="font-size:1rem;margin:0">🏆 HIGH SCORES</h2><button class="btn sm" data-nav="home">← Borne</button></div>
      <div class="tabs" id="b-game"></div>
      <div class="tabs" id="b-scope"></div>
      <div id="b-table"></div>
      <p class="note" id="b-note"></p>
      <div id="b-admin"></div>
    </div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* NOTIONS est injecté depuis Coach E2 au moment de la construction */
const NOTIONS = [
 ["Prospection","Prospection","Recherche de nouveaux clients (prospects) pour développer le chiffre d’affaires et compenser la perte de clients."],
 ["Suspect / prospect","Prospection","Suspect : personne qui pourrait être intéressée. Prospect : personne ciblée et qualifiée, susceptible de devenir cliente."],
 ["Fichier prospects","Prospection","Base de données de contacts à démarcher (identité, coordonnées, critères de qualification)."],
 ["Qualifier un fichier","Prospection","Compléter et mettre à jour les informations des contacts pour repérer les plus intéressants."],
 ["Ciblage / segmentation","Prospection","Découper le marché en groupes homogènes et choisir ceux à prospecter en priorité."],
 ["Zone de chalandise","Prospection","Zone géographique d’où vient l’essentiel de la clientèle d’un point de vente."],
 ["Phoning","Prospection","Prospection par téléphone, souvent pour obtenir un rendez-vous."],
 ["Plan d’appel","Prospection","Trame structurée d’un appel : présentation, accroche, découverte, proposition, objections, conclusion."],
 ["Barrage secrétaire","Prospection","Filtrage par un(e) assistant(e) avant d’atteindre le décideur."],
 ["E-mailing / mailing","Prospection","Envoi de messages commerciaux par courriel / par courrier à une liste de contacts."],
 ["SMS marketing","Prospection","Message court (160 caractères max) à fort taux de lecture ; doit contenir l’émetteur et la mention STOP."],
 ["Street marketing","Prospection","Action commerciale dans la rue ou un lieu de passage pour aller au contact des prospects."],
 ["Prescripteur","Prospection","Personne qui influence l’achat sans acheter elle-même (architecte, influenceur, ado pour ses parents…)."],
 ["Recommandation / parrainage","Prospection","Un client satisfait fournit des contacts ou recommande l’entreprise."],
 ["B2B / B2C","Marché","B2B : vente entre entreprises. B2C : vente d’une entreprise à des particuliers."],
 ["CHR","Marché","Cafés, Hôtels, Restaurants : circuit de distribution hors domicile."],
 ["GMS","Marché","Grandes et Moyennes Surfaces (hypermarchés, supermarchés)."],
 ["Veille commerciale","Marché","Surveillance régulière du marché, des concurrents et des tendances."],
 ["Diagnostic SWOT","Marché","Forces / faiblesses (interne) et opportunités / menaces (externe) d’une entreprise."],
 ["Avantage concurrentiel","Marché","Ce qui distingue l’entreprise de ses concurrents aux yeux du client."],
 ["Premiumisation","Marché","Montée en gamme d’un produit ou d’un marché (prix et qualité plus élevés)."],
 ["Omnicanal","Marché","Le client passe librement d’un canal à l’autre (site, magasin, réseaux) dans un même parcours."],
 ["Marketplace","Marché","Place de marché en ligne qui met en relation vendeurs et acheteurs (ex. ANKORSTORE en B2B)."],
 ["Drive-to-store","Marché","Utiliser le digital pour générer des visites en magasin."],
 ["SIC","Outils","Système d’Information Commercial : ensemble des données clients, prospects et ventes exploitées par l’entreprise."],
 ["CRM","Outils","Logiciel de gestion de la relation client qui centralise contacts, historiques et relances."],
 ["RGPD","Outils","Règlement sur la protection des données : consentement, données utiles uniquement, droit d’accès et de suppression."],
 ["Fiche contact","Outils","Document de collecte : identification, qualification, besoins, suite à donner."],
 ["Tableau de bord","Outils","Ensemble d’indicateurs pour suivre l’atteinte des objectifs et réagir."],
 ["Taux de réalisation (R/O)","Indicateurs","Résultat ÷ objectif × 100."],
 ["Taux de transformation","Indicateurs","Part des contacts qui passent à l’étape suivante (RDV, vente) : étape ÷ étape précédente × 100."],
 ["Taux d’engagement","Indicateurs","Interactions (likes, commentaires, partages) ÷ vues ou abonnés × 100."],
 ["Rentabilité d’une opération","Indicateurs","Marge générée (CA × taux de marque) − coûts de l’opération."],
 ["Taux de marque","Indicateurs","Marge ÷ prix de vente HT × 100."],
 ["Taux de marge","Indicateurs","Marge ÷ prix d’achat HT × 100."],
 ["Coefficient multiplicateur","Indicateurs","Nombre par lequel on multiplie le PA HT pour obtenir le PV TTC."],
 ["Objectif quantitatif / qualitatif","Indicateurs","Quantitatif : chiffré (contacts, RDV, CA). Qualitatif : image, notoriété, informations collectées."],
 ["SONCASE","Vente","Mobiles d’achat : Sécurité, Orgueil, Nouveauté, Confort, Argent, Sympathie, Environnement."],
 ["Méthode CAP","Vente","Argument structuré : Caractéristique → Avantage pour le client → Preuve."],
 ["Objection","Vente","Frein exprimé par le client ; se traite par reformulation puis réponse adaptée."],
 ["Pitch","Vente","Présentation courte et percutante : qui on est, le problème du client, la solution, l’appel à l’action."],
 ["Argumentaire","Vente","Ensemble d’arguments préparés pour convaincre une cible."],
 ["Salon professionnel","Événement","Manifestation réservée aux professionnels pour rencontrer prospects et clients, vendre et gagner en notoriété."],
 ["Goodies","Événement","Objets publicitaires offerts aux visiteurs (stylos, tote bags…)."],
 ["PLV","Événement","Publicité sur le Lieu de Vente : présentoirs, kakémonos, testeurs…"],
 ["Facteurs d’ambiance","Événement","Éléments sensoriels (vue, ouïe, odorat, goût, toucher) qui rendent un lieu attractif."],
 ["Théâtralisation","Événement","Mise en scène des produits pour créer une émotion et attirer l’attention."],
 ["Relance","Événement","Nouveau contact après un premier échange (courriel, salon) pour transformer l’intérêt en RDV ou en vente."]
];

/* Phrases de notes synthétiques, tirées des sujets — à ranger dans la bonne partie */
const BINS = [
 {k:"entete", l:"En-tête", d:"De / À / Date / Objet"},
 {k:"intro", l:"Introduction", d:"Contexte et objet de la note"},
 {k:"dev", l:"Développement", d:"Constats chiffrés, intérêts, risques"},

];
const SYNTH = [

 ["60 % des Françaises achètent des cosmétiques bio, contre 33 % en 2010.","dev"],
 ["Le prix reste un frein pour plus de 60 % des consommatrices.","dev"],
 ["72 % des 18-34 ans envisagent d’utiliser un EDPM pour se déplacer.","dev"],
 ["Le salon a coûté 3 934,75 € pour une marge de 2 362,68 €.","dev"],
 ["Notre pack hiver est moins cher que ceux des quatre concurrents.","dev"],
 ["Je vous recommande de lancer le fût en édition limitée auprès des CHR haut de gamme.","concl"],
 ["En conclusion, l’opération est rentable et peut être reconduite l’an prochain.","concl"],
 ["Je préconise de privilégier les magasins spécialisés bio et la marketplace ANKORSTORE.","concl"],
 ["Je propose de former les vendeurs FNAC-DARTY avant la prochaine tournée.","concl"],
 ["Il serait donc pertinent de cibler en priorité les exploitations agricoles et l’événementiel.","concl"],
 ["Franchement, cette bière est trop bonne, tout le monde va l’adorer !","hors"],
 ["Je pense que ça va marcher, mais je ne sais pas trop pourquoi.","hors"],
 ["LOL, les concurrents sont nuls.","hors"],
 ["Je n’ai pas eu le temps de lire tous les documents.","hors"],
 ["Bisous et bonne soirée !","hors"],
 ["Ma cousine trouve que les trottinettes c’est dangereux.","hors"]
];
/* Manche bonus : remettre la note dans l’ordre */
const ORDER = ["En-tête : De / À / Date","Objet","Introduction : contexte et demande","Développement : constats chiffrés","Développement : intérêts et risques","Recommandation argumentée","Signature"];

</script>
<script>
/* ================= Utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const nf = (n, d) => Number(n).toLocaleString("fr-FR", {minimumFractionDigits: d ?? (Number.isInteger(Math.round(n*100)/100) ? 0 : 2), maximumFractionDigits: 2});
const eur = n => nf(n) + " €", pct = n => nf(Math.round(n*100)/100) + " %";
function toast(m){ const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }

const KEY = "arcadeE2.v1";
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { S = {}; }
S.pseudo ??= ""; S.xp ??= 0; S.sound ??= true; S.best ??= {}; S.local ??= {inv:[],note:[],rush:[]}; S.miss ??= {};
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

/* ================= Grades ================= */
const RANKS = [[0,"STAGIAIRE"],[400,"VENDEUR JUNIOR"],[1200,"COMMERCIAL(E)"],[3000,"COMMERCIAL(E) CONFIRMÉ(E)"],[6000,"CHEF DES VENTES"],[10000,"DIRECTEUR COMMERCIAL"],[16000,"LÉGENDE DU BAC PRO"]];
function rankOf(xp){ let i = 0; while (i + 1 < RANKS.length && xp >= RANKS[i+1][0]) i++; return i; }

/* ================= Son ================= */
let AC = null;
function beep(f, d = .09, type = "square", vol = .06, when = 0){
  if (!S.sound) return; try { AC ??= new (window.AudioContext || window.webkitAudioContext)(); const t = AC.currentTime + when;
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch (e) {} }
const SFX = { good:(c)=>{ beep(520+c*40,.07); beep(780+c*40,.09,"square",.05,.06); }, bad:()=>{ beep(150,.25,"sawtooth",.07); },
  level:()=>[523,659,784,1046].forEach((f,i)=>beep(f,.1,"square",.05,i*.08)), over:()=>[392,330,262,196].forEach((f,i)=>beep(f,.18,"triangle",.07,i*.16)), life:()=>[880,1175].forEach((f,i)=>beep(f,.08,"square",.05,i*.07)) };

/* ================= Pondération : ce qui a été raté revient plus souvent ================= */
function weighted(list, keyFn){ const w = list.map(x => 1 + 3 * (S.miss[keyFn(x)] || 0)); let r = Math.random() * w.reduce((a,b)=>a+b,0); for (let i = 0; i < list.length; i++) { r -= w[i]; if (r <= 0) return list[i]; } return list[list.length-1]; }
function missed(k){ S.miss[k] = Math.min(5, (S.miss[k] || 0) + 1); }
function learned(k){ if (S.miss[k]) S.miss[k] = Math.max(0, S.miss[k] - 1); }

/* ================= Générateurs de manches ================= */
const GAMES = {
 inv:{nom:"PROSPECT INVADERS", skill:"Vocabulaire du commercial", desc:"Les définitions tombent : tire le bon mot avant qu’elles touchent le sol. Aux niveaux pairs, c’est l’inverse.", color:"var(--pink)", cls:"",
  time:l=>Math.max(3.4, 9.5 - (l-1)*.75),
  gen(l){
    const n = NOTIONS_W(); const reverse = l >= 2 && l % 2 === 0; const nOpt = l >= 3 ? 4 : 3;
    const same = shuffle(NOTIONS.filter(x => x[0] !== n[0] && x[1] === n[1])); const other = shuffle(NOTIONS.filter(x => x[0] !== n[0] && x[1] !== n[1]));
    const wrong = [...same, ...other].slice(0, nOpt - 1);
    const opts = shuffle([n, ...wrong]).map(x => ({t: reverse ? x[2] : x[0], ok: x === n}));
    return {key:"v:"+n[0], kind: reverse ? "Quelle définition ?" : "Quel mot ?", prompt: reverse ? n[0] : n[2], opts, long: reverse, many: nOpt > 3,
      trap:{q: reverse ? n[0] : n[2], a: n[0], ex: n[2]}};
  }},
 note:{nom:"NOTE EXPRESS", skill:"Structure de la note de synthèse", desc:"Des phrases de notes tombent : range-les dans la bonne partie, élimine celles qui n’ont rien à faire là. Manche bonus : remets la note dans l’ordre.", color:"var(--cyan)", cls:"c-note",
  time:l=>Math.max(3.6, 9 - (l-1)*.65),
  gen(){
    const s = weighted(SYNTH, x => "n:"+x[0]); const b = BINS.find(x => x.k === s[1]);
    return {key:"n:"+s[0], kind:"Phrase de note", prompt:s[0], opts:BINS.map(x => ({t:x.l, ok:x.k===s[1]})), many:true,
      trap:{q:s[0], a:b.l, ex:b.d}};
  }},
 rush:{nom:"RUSH DU COMMERCIAL", skill:"Calculs commerciaux", desc:"Le calcul fonce vers toi : choisis la bonne porte. Les mauvaises portes cachent les erreurs classiques de l’examen.", color:"var(--amber)", cls:"c-rush",
  time:l=>Math.max(4.8, 12 - (l-1)*.8),
  gen(l){ for (let i = 0; i < 20; i++) { const g = pick(RUSH.filter(x => x.tier <= Math.min(3, Math.ceil(l/2)))); const r = g.f();
      const all = [r.a, ...r.w].map(String); if (new Set(all).size === all.length) {
        return {key:"r:"+g.id, kind:g.label, prompt:r.q, calc:true, door:true, opts:shuffle([{t:r.a,ok:true}, ...r.w.map(t => ({t, ok:false}))]),
          trap:{q:r.q, a:r.a, ex:r.ex}}; } } }}
};
function NOTIONS_W(){ return weighted(NOTIONS, x => "v:"+x[0]); }

const RUSH = [
 {id:"coef", tier:1, label:"Prix de vente TTC", f(){ const pa = pick([4,5,6,8,10,12,15,20,25,40]), k = pick([1.5,2,2.5,3]); const a = pa*k;
   return {q:`PA HT ${eur(pa)} · coefficient ${nf(k)}\nPV TTC = ?`, a:eur(a), w:[eur(a/1.2), eur(pa+k)], ex:`PV TTC = PA HT × coef = ${nf(pa)} × ${nf(k)} = ${eur(a)}`}; }},
 {id:"ht", tier:1, label:"TTC → HT", f(){ const t = pick([12,24,36,48,60,90,120,240,360]); const a = t/1.2;
   return {q:`PV TTC ${eur(t)} · TVA 20 %\nPV HT = ?`, a:eur(a), w:[eur(t*.8), eur(t*1.2)], ex:`PV HT = TTC ÷ 1,20 = ${nf(t)} ÷ 1,2 = ${eur(a)} (et non TTC × 0,8)`}; }},
 {id:"remise", tier:1, label:"Prix remisé", f(){ const p = pick([20,40,50,80,120,200,300]), r = pick([10,20,25,30,50]); const a = p*(1-r/100);
   return {q:`Prix ${eur(p)} · remise ${r} %\nPrix remisé = ?`, a:eur(a), w:[eur(p*r/100), eur(p-r)], ex:`Prix remisé = ${nf(p)} × (1 − ${r} %) = ${eur(a)}`}; }},
 {id:"marge", tier:1, label:"Marge unitaire", f(){ const pa = pick([20,30,40,60,80,120]), pv = pa*pick([1.25,1.5,2]); const m = pv-pa;
   return {q:`PA HT ${eur(pa)} · PV HT ${eur(pv)}\nMarge unitaire = ?`, a:eur(m), w:[eur(pv+pa), pct(m/pv*100)], ex:`Marge = PV HT − PA HT = ${nf(pv)} − ${nf(pa)} = ${eur(m)}`}; }},
 {id:"tmarque", tier:2, label:"Taux de marque", f(){ const pv = pick([50,80,100,200,400]), s = pick([20,25,40,50]); const pa = pv*(1-s/100), m = pv-pa;
   return {q:`PA HT ${eur(pa)} · PV HT ${eur(pv)}\nTaux de marque = ?`, a:pct(s), w:[pct(m/pa*100), pct(s/100)], ex:`Taux de marque = marge ÷ PV HT × 100 = ${nf(m)} ÷ ${nf(pv)} × 100 = ${pct(s)}`}; }},
 {id:"tmarge", tier:2, label:"Taux de marge", f(){ const pa = pick([40,50,80,100,200]), t = pick([25,50,60,100]); const pv = pa*(1+t/100), m = pv-pa;
   return {q:`PA HT ${eur(pa)} · PV HT ${eur(pv)}\nTaux de marge = ?`, a:pct(t), w:[pct(m/pv*100), pct(t/100)], ex:`Taux de marge = marge ÷ PA HT × 100 = ${nf(m)} ÷ ${nf(pa)} × 100 = ${pct(t)}`}; }},
 {id:"real", tier:2, label:"Taux de réalisation", f(){ const o = pick([40,50,60,80,200,4300,9000,12000]), k = pick([.75,.8,.9,1.05,1.1,1.25]); const r = Math.round(o*k); const a = r/o*100;
   return {q:`Objectif ${nf(o)} · Résultat ${nf(r)}\nTaux de réalisation = ?`, a:pct(a), w:[pct(o/r*100), pct((r-o)/r*100)], ex:`Résultat ÷ objectif × 100 = ${nf(r)} ÷ ${nf(o)} × 100 = ${pct(a)}`}; }},
 {id:"evol", tier:3, label:"Taux d’évolution", f(){ const v1 = pick([200,400,500,800,1000,2000,3170]), k = pick([1.1,1.25,1.5,.8,.9,2]); const v2 = Math.round(v1*k); const a = (v2-v1)/v1*100;
   return {q:`Avant ${nf(v1)} · Après ${nf(v2)}\nTaux d’évolution = ?`, a:pct(a), w:[pct((v2-v1)/v2*100), pct(v2/v1*100)], ex:`(Après − avant) ÷ avant × 100 = (${nf(v2)} − ${nf(v1)}) ÷ ${nf(v1)} × 100 = ${pct(a)}`}; }},
 {id:"transf", tier:3, label:"Taux de transformation", f(){ const ap = pick([80,100,120,200,250]), k = pick([.1,.15,.2,.25,.3,.4]); const rdv = Math.round(ap*k); const a = rdv/ap*100;
   return {q:`${ap} appels aboutis · ${rdv} RDV\nTaux de prise de RDV = ?`, a:pct(a), w:[pct(rdv/ap), pct((ap-rdv)/ap*100)], ex:`RDV ÷ appels aboutis × 100 = ${rdv} ÷ ${ap} × 100 = ${pct(a)}`}; }},
 {id:"renta", tier:3, label:"Rentabilité", f(){ const ca = pick([5000,8000,9600,10000,12000,13200]), tm = pick([40,50,60]), c = pick([2000,3000,4000,4674,5126]); const m = ca*tm/100; const a = m-c;
   return {q:`CA HT ${eur(ca)} · taux de marque ${tm} %\nCoût de l’opération ${eur(c)}\nRésultat = ?`, a:eur(a), w:[eur(ca-c), eur(m)], ex:`Marge = ${nf(ca)} × ${tm} % = ${eur(m)} ; résultat = marge − coût = ${eur(a)}`}; }},
 {id:"eng", tier:3, label:"Taux d’engagement", f(){ const v = pick([500,1000,1487,2000,4000]), k = pick([.05,.08,.1,.2,.25]); const i = Math.round(v*k); const a = i/v*100;
   return {q:`${nf(v)} vues · ${i} interactions\nTaux d’engagement = ?`, a:pct(a), w:[pct(i/v), pct(v/i)], ex:`Interactions ÷ vues × 100 = ${i} ÷ ${nf(v)} × 100 = ${pct(a)}`}; }}
];

/* ================= Écrans ================= */
function show(id){ ["home","play","over","board"].forEach(x => $("#"+x).hidden = x !== id); window.scrollTo(0,0); }
document.addEventListener("click", e => { const n = e.target.closest("[data-nav]"); if (!n) return; if (n.dataset.nav === "board") { renderBoard(); show("board"); } else { renderHome(); show("home"); } });

function cleanPseudo(v){ return String(v || "").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Z0-9_-]/g,"").slice(0,12); }
$("#pseudo").value = S.pseudo;
$("#pseudo").addEventListener("input", e => { const c = cleanPseudo(e.target.value); if (c !== e.target.value) e.target.value = c; S.pseudo = c; save(); });
$("#pseudo").addEventListener("change", () => pushClass());
$("#snd-btn").addEventListener("click", () => { S.sound = !S.sound; save(); drawSound(); if (S.sound) SFX.good(0); });
function drawSound(){ $("#snd-btn").textContent = S.sound ? "🔊 Son activé" : "🔇 Son coupé"; }

function renderHome(){
  const ri = rankOf(S.xp), cur = RANKS[ri], next = RANKS[ri+1];
  $("#rank-name").textContent = cur[1];
  $("#xp-fill").style.width = next ? Math.round((S.xp - cur[0]) / (next[0] - cur[0]) * 100) + "%" : "100%";
  $("#xp-txt").textContent = next ? `${nf(S.xp,0)} XP · encore ${nf(next[0]-S.xp,0)} XP pour « ${next[1].toLowerCase()} »` : `${nf(S.xp,0)} XP · grade maximum !`;
  $("#cabinets").innerHTML = Object.entries(GAMES).map(([k,g]) => {
    const top = classTop(k)[0];
    return `<div class="cab ${g.cls}"><h2>${g.nom}</h2><p><b style="color:var(--ink)">${g.skill}</b></p><p>${g.desc}</p>
      <div class="best"><span>Ton record</span><b>${nf(S.best[k]||0,0)}</b></div>
      <div class="best"><span>${top ? "Record de la classe" : "Record de l’appareil"}</span><b class="cr" data-cr="${k}"></b></div>
      <button class="btn go" data-start="${k}">▶ JOUER</button></div>`; }).join("");
  $$("[data-cr]").forEach(el => { const k = el.dataset.cr; const top = classTop(k)[0] || localTop(k)[0]; el.textContent = top ? `${nf(top.score,0)} · ${top.pseudo}` : "—"; });
  drawSound();
}
$("#cabinets").addEventListener("click", e => { const b = e.target.closest("[data-start]"); if (!b) return;
  if (!S.pseudo) { toast("Choisis d’abord ton pseudo de joueur"); $("#pseudo").focus(); return; } start(b.dataset.start); });

/* ================= Moteur de jeu ================= */
let G = null;
function start(k){
  const g = GAMES[k]; document.documentElement.style.setProperty("--game", g.color);
  G = {k, g, score:0, lives:3, level:1, streak:0, best:0, correct:0, item:null, card:null, t0:0, T:0, busy:false, traps:[], raf:0, paused:false, bonusDone:0};
  $("#field-tag").textContent = g.nom; show("play"); hud(); next();
}
function hud(){ $("#h-score").textContent = nf(G.score,0); $("#h-level").textContent = G.level; $("#h-lives").textContent = "♥".repeat(G.lives) + "♡".repeat(Math.max(0, 3 - G.lives));
  const m = mult(); $("#h-combo").textContent = `x${m}${G.streak >= 3 ? " 🔥" + G.streak : ""}`; }
const mult = () => Math.min(5, 1 + Math.floor(G.streak / 4));
function next(){
  if (!G) return;
  if (G.k === "note" && G.correct > 0 && G.correct % 10 === 0 && G.bonusDone < G.correct) { G.bonusDone = G.correct; return orderRound(); }
  const it = G.g.gen(G.level); G.item = it; G.busy = false;
  const f = $("#field"); $$(".card,.runner", f).forEach(x => x.remove());
  const c = document.createElement("div"); c.className = "card" + (it.calc ? " calc" : "");
  c.innerHTML = `<span class="kind">${esc(it.kind)}</span>${esc(it.prompt).replace(/\n/g,"<br>")}`; f.appendChild(c); G.card = c;
  const o = $("#opts"); o.className = "opts" + (it.many ? " many" : ""); o.style.setProperty("--n", it.opts.length > 3 ? (it.opts.length === 4 ? 2 : 3) : it.opts.length);
  o.innerHTML = it.opts.map((x,i) => `<button class="opt ${it.long ? "long" : ""} ${it.door ? "door" : ""}" data-i="${i}"><span class="k">${i+1}</span>${esc(x.t)}</button>`).join("");
  if (it.door) { const r = document.createElement("div"); r.className = "runner"; r.textContent = "🏃"; r.style.left = "50%"; f.appendChild(r); }
  G.T = G.g.time(G.level) * 1000 * (it.long ? 1.35 : 1); G.t0 = performance.now(); G.elapsed = 0;
  cancelAnimationFrame(G.raf); G.last = performance.now(); G.raf = requestAnimationFrame(loop);
}
function loop(now){
  if (!G || G.busy) return;
  const dt = now - G.last; G.last = now; if (!G.paused) G.elapsed += Math.min(dt, 100);
  const f = $("#field"), c = G.card; const H = f.clientHeight - c.offsetHeight - 10; const p = Math.min(1, G.elapsed / G.T);
  c.style.transform = `translate(-50%, ${Math.round(-c.offsetHeight*.2 + (H + c.offsetHeight*.2) * p)}px)`;
  if (p >= 1) return answer(-1);
  G.raf = requestAnimationFrame(loop);
}
$("#opts").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) answer(+b.dataset.i); });
document.addEventListener("keydown", e => {
  if ($("#play").hidden || !G) return;
  if (e.key === "Escape") { quit(); return; }
  if (G.order) { const n = parseInt(e.key, 10); if (n >= 1) $$(".blk")[n-1]?.click(); return; }
  const n = parseInt(e.key, 10); if (n >= 1 && n <= (G.item?.opts.length || 0)) answer(n - 1);
});
document.addEventListener("visibilitychange", () => { if (G) G.paused = document.hidden; });
$("#quit").addEventListener("click", quit);
function quit(){ if (!G) return; cancelAnimationFrame(G.raf); if (G.score > 0) gameOver(); else { G = null; renderHome(); show("home"); } }

function answer(i){
  if (!G || G.busy) return; G.busy = true; cancelAnimationFrame(G.raf);
  const it = G.item, btns = $$("#opts .opt"); const ok = i >= 0 && it.opts[i].ok;
  const goodIdx = it.opts.findIndex(x => x.ok); btns[goodIdx]?.classList.add("good"); if (i >= 0 && !ok) btns[i].classList.add("bad");
  const f = $("#field");
  if (it.door && i >= 0) { const r = $(".runner", f); if (r) r.style.left = ((i + .5) / it.opts.length * 100) + "%"; }
  if (ok) {
    const speed = Math.max(0, 1 - G.elapsed / G.T); const m = mult(); const pts = Math.round((100 + 100 * speed) * m) * (1 + Math.floor((G.level-1)/3) * .5);
    G.score += Math.round(pts); G.streak++; G.correct++; G.best = Math.max(G.best, G.streak); learned(it.key);
    G.card.classList.add("hit"); floatTxt(`+${Math.round(pts)}`); SFX.good(Math.min(G.streak, 10));
    if (G.streak % 12 === 0 && G.lives < 5) { G.lives++; floatTxt("+1 ♥", 30); SFX.life(); }
    if (G.correct % 6 === 0) { G.level++; levelUp(); }
  } else {
    G.lives--; G.streak = 0; missed(it.key); G.card.classList.add("miss"); f.classList.remove("flash-bad"); void f.offsetWidth; f.classList.add("flash-bad"); SFX.bad();
    if (!G.traps.some(t => t.q === it.trap.q)) G.traps.push(it.trap);
  }
  save(); hud();
  setTimeout(() => { if (!G) return; if (G.lives <= 0) gameOver(); else next(); }, ok ? 450 : 1300);
}
function floatTxt(t, dy = 0){ const f = $("#field"); const s = document.createElement("span"); s.className = "float"; s.textContent = t; s.style.left = "50%"; s.style.top = (40 + dy) + "%"; f.appendChild(s); setTimeout(() => s.remove(), 900); }
function levelUp(){ const f = $("#field"); const d = document.createElement("div"); d.className = "levelup"; d.textContent = `NIVEAU ${G.level}`; f.appendChild(d); setTimeout(() => d.remove(), 1200); SFX.level(); }

/* Manche bonus de Note Express : remettre la note dans l’ordre */
function orderRound(){
  G.order = true; G.busy = true; const f = $("#field"); $$(".card", f).forEach(x => x.remove());
  const blocks = shuffle(ORDER.map((t,i) => ({t,i}))); let nextI = 0, errs = 0; const t0 = performance.now();
  const box = document.createElement("div"); box.className = "order-round";
  box.innerHTML = `<h3>MANCHE BONUS<br>Touche les blocs dans l’ordre de la note</h3><div class="blocks">${blocks.map((b,k) => `<button class="blk" data-o="${b.i}"><span class="muted">${k+1}.</span> ${esc(b.t)}</button>`).join("")}</div>`;
  f.appendChild(box); $("#opts").innerHTML = "";
  box.addEventListener("click", e => { const b = e.target.closest(".blk"); if (!b || b.classList.contains("done")) return;
    if (+b.dataset.o === nextI) { b.classList.add("done"); nextI++; SFX.good(nextI); if (nextI === ORDER.length) {
        const sec = (performance.now() - t0) / 1000; const pts = Math.max(100, Math.round(1400 - sec * 40 - errs * 150)); G.score += pts; hud();
        box.innerHTML = `<h3>NOTE COMPLÈTE !<br>+${pts} points</h3>`; G.order = false; setTimeout(() => { box.remove(); G.busy = false; next(); }, 1100); } }
    else { errs++; b.classList.add("err"); setTimeout(() => b.classList.remove("err"), 300); SFX.bad(); if (!G.traps.some(t => t.q === "ordre")) G.traps.push({q:"ordre", a:ORDER.join(" → "), ex:"Ordre attendu d’une note synthétique."}); } });
}

/* ================= Fin de partie ================= */
function gameOver(){
  const g = G; G = null; cancelAnimationFrame(g.raf); SFX.over();
  const k = g.k, score = g.score; const record = score > (S.best[k] || 0) && score > 0;
  if (record) S.best[k] = score;
  const xpGain = Math.round(score / 10); const before = rankOf(S.xp); S.xp += xpGain; const after = rankOf(S.xp);
  if (score > 0) { S.local[k] = [...(S.local[k] || []), {pseudo:S.pseudo, score, d:Date.now()}].sort((a,b) => b.score - a.score).slice(0, 10); }
  save(); if (record) pushClass();
  const classPos = classTop(k).findIndex(x => x.id === UID) + 1;
  $("#over-box").innerHTML = `
    <div class="big"><span class="muted">${g.g.nom}</span><span class="pix">${nf(score,0)}</span>
      ${record ? `<span class="record">★ NOUVEAU RECORD ★</span>` : `<span class="muted">Ton record : ${nf(S.best[k]||0,0)}</span>`}
      <span class="muted">Niveau ${g.level} · meilleure série ${g.best} · +${nf(xpGain,0)} XP${after > before ? ` · nouveau grade : <b style="color:var(--amber)">${RANKS[after][1]}</b>` : ""}${classPos ? ` · ${classPos}ᵉ de la classe` : ""}</span>
      <div class="row" style="justify-content:center;margin-top:6px"><button class="btn go" id="again">↻ Rejouer</button><button class="btn" data-nav="home">Borne</button><button class="btn" data-nav="board">🏆 Classement</button></div></div>
    ${g.traps.length ? `<div class="traps"><h3>TES PIÈGES DU JOUR · ${g.traps.length}</h3>${g.traps.map(t => `<div class="trap">${t.q === "ordre" ? "" : esc(t.q).replace(/\n/g," · ")}<br>→ <b>${esc(t.a)}</b><small>${esc(t.ex)}</small></div>`).join("")}<p class="muted" style="font-size:.85rem;margin:0">Ces questions reviendront plus souvent dans tes prochaines parties jusqu’à ce que tu les réussisses.</p></div>` : `<div class="traps"><h3 style="color:var(--good)">SANS FAUTE !</h3></div>`}`;
  document.documentElement.style.setProperty("--game", g.g.color);
  $("#again").onclick = () => start(k); show("over");
}

/* ================= Classements ================= */
let DB = null, UID = null, OWNER = false, CLASS = {docs:[], live:false, write:null}, WRITING = Promise.resolve();
function classTop(k){ return CLASS.live ? CLASS.docs.filter(d => (+d[k] || 0) > 0 && typeof d.pseudo === "string").map(d => ({id:d.id, pseudo:cleanPseudo(d.pseudo) || "ANONYME", score:+d[k]})).sort((a,b) => b.score - a.score) : []; }
function localTop(k){ return (S.local[k] || []).map(x => ({pseudo:cleanPseudo(x.pseudo) || "ANONYME", score:x.score})); }
function pushClass(){
  if (!DB || !UID || CLASS.write === false || !S.pseudo) return;
  const has = ["inv","note","rush"].some(k => S.best[k] > 0); if (!has) return;
  const body = {pseudo:S.pseudo, inv:S.best.inv || 0, note:S.best.note || 0, rush:S.best.rush || 0, xp:S.xp, ts:Date.now()};
  WRITING = WRITING.then(() => DB.doc("scores/" + UID).set(body)).catch(e => { if (e && e.code === "invalid_argument") { CLASS.write = false; toast("Score gardé sur cet appareil : le classement de la classe est en lecture seule pour toi"); } });
}
(async function initClass(){
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]); if (!db || !user) return;
    UID = await user.id(); if (!UID) return; DB = db; OWNER = await user.isOwner();
    const w = await user.can("data.write"); CLASS.write = w === false ? false : null;
    db.collection("scores").limit(500).onSnapshot(s => { CLASS.docs = s.docs.map(d => ({id:d.id, ...d.data()})); CLASS.live = true; if (!$("#home").hidden) renderHome(); if (!$("#board").hidden) renderBoard(); },
      () => { CLASS.live = false; });
    pushClass();
  } catch (e) {}
})();

let B = {game:"inv", scope:"classe"};
function renderBoard(){
  if (!CLASS.live && B.scope === "classe") B.scope = "app";
  $("#b-game").innerHTML = Object.entries(GAMES).map(([k,g]) => `<button data-g="${k}" aria-pressed="${B.game===k}">${g.nom.toLowerCase().replace(/^\w/, c => c.toUpperCase())}</button>`).join("");
  $("#b-scope").innerHTML = `<button data-s="classe" aria-pressed="${B.scope==="classe"}" ${CLASS.live ? "" : "disabled"}>Classe</button><button data-s="app" aria-pressed="${B.scope==="app"}">Cet appareil</button>`;
  const list = (B.scope === "classe" ? classTop(B.game) : localTop(B.game)).slice(0, 20);
  $("#b-table").innerHTML = list.length ? `<div style="overflow-x:auto"><table class="hs"><thead><tr><th>#</th><th>Joueur</th><th style="text-align:right">Score</th>${OWNER && B.scope==="classe" ? "<th></th>" : ""}</tr></thead><tbody>${list.map((x,i) => `<tr class="${(x.id && x.id===UID) || (!x.id && x.pseudo===S.pseudo) ? "me" : ""}"><td>${i+1}</td><td class="pn"></td><td class="sc">${nf(x.score,0)}</td>${OWNER && B.scope==="classe" ? `<td><button class="x" data-del="${esc(x.id)}" aria-label="Retirer ce score">✕</button></td>` : ""}</tr>`).join("")}</tbody></table></div>` : `<p class="note">Aucun score pour l’instant. À toi de poser le premier record !</p>`;
  $$("#b-table td.pn").forEach((td,i) => td.textContent = list[i].pseudo);
  $("#b-note").textContent = CLASS.live ? (CLASS.write === false ? "Tu vois le classement de la classe mais tes scores restent sur cet appareil : ton professeur doit te donner l’accès « Contributeur »." : "Classement de la classe en direct : ton meilleur score s’y inscrit automatiquement avec ton pseudo.") : "Classement de la classe indisponible ici (il faut être connecté à un compte Claude ayant accès à la page). Les scores de cet appareil sont bien enregistrés.";
  $("#b-admin").innerHTML = OWNER && CLASS.live ? `<div class="row"><button class="btn sm" id="reset-all">Remettre le classement de la classe à zéro</button><span class="muted" style="font-size:.82rem">Visible par toi seul(e), propriétaire de la page.</span></div>` : "";
}
$("#b-game").addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (b) { B.game = b.dataset.g; renderBoard(); } });
$("#b-scope").addEventListener("click", e => { const b = e.target.closest("[data-s]"); if (b && !b.disabled) { B.scope = b.dataset.s; renderBoard(); } });
$("#b-table").addEventListener("click", async e => { const b = e.target.closest("[data-del]"); if (!b || !DB) return;
  if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Retirer ?"; return; } try { await DB.doc("scores/" + b.dataset.del).delete(); toast("Score retiré"); } catch (er) { toast("Suppression impossible"); } });
$("#b-admin").addEventListener("click", async e => { const b = e.target.closest("#reset-all"); if (!b || !DB) return;
  if (!b.dataset.sure) { b.dataset.sure = "1"; b.textContent = "Confirmer : tout effacer"; setTimeout(() => { if (b.isConnected) { delete b.dataset.sure; b.textContent = "Remettre le classement de la classe à zéro"; } }, 4000); return; }
  b.disabled = true; for (const d of [...CLASS.docs]) { try { await DB.doc("scores/" + d.id).delete(); } catch (er) {} } toast("Classement remis à zéro"); });

renderHome();

</script>

</body></html>
